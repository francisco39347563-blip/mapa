<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa Interativo - INPE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; display: none; }
        #telaInicial { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #btnLocalizar { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="telaInicial">
        <h2>Mapa Interativo</h2>
        <button id="btnLocalizar">📍 Localizar-me</button>
    </div>

    <div id="infoModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal" class="modal-close">×</button>
            <div id="modalSlider" class="modal-slider hidden">
                <button id="sliderPrev" type="button" class="slider-button">‹</button>
                <div class="slider-frame">
                    <img id="sliderImage" src="" alt="Foto do local">
                </div>
                <button id="sliderNext" type="button" class="slider-button">›</button>
            </div>
            <div id="sliderCounter" class="slider-counter"></div>
            <h3 id="modalTitle"></h3>
            <p id="modalDescription"></p>
        </div>
    </div>
    <div id="imageViewer" class="image-viewer hidden">
        <div class="image-viewer-content">
            <button id="closeViewer" class="viewer-close">×</button>
            <img id="viewerImage" src="" alt="Imagem ampliada">
        </div>
    </div>

    <div id="markerFormModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeFormModal" class="modal-close">×</button>
            <h3>Novo ponto</h3>
            <form id="markerForm">
                <label>Nome do local
                    <input type="text" id="markerName" required>
                </label>
                <label>Status
                    <select id="markerStatus">
                        <option value="Aberto">Aberto</option>
                        <option value="Fechado">Fechado</option>
                    </select>
                </label>
                <label>Descrição
                    <textarea id="markerDescription" rows="6" required></textarea>
                </label>
                <label>Imagens</label>
                <div id="imageDropZone" class="upload-zone">
                    Arraste as imagens aqui ou clique para selecionar
                </div>
                <input type="file" id="imageInput" accept="image/*" multiple hidden>
                <div id="imagePreview" class="preview-list"></div>
                <div class="modal-actions">
                    <button type="button" id="cancelMarkerButton">Cancelar</button>
                    <button type="submit">Salvar ponto</button>
                </div>
            </form>
        </div>
    </div>

    <div id="trilhaFormModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeTrilhaFormModal" class="modal-close">×</button>
            <h3>Nova trilha</h3>
            <form id="trilhaForm">
                <label>Nome da trilha
                    <input type="text" id="trilhaName" required>
                </label>
                <label>Cor
                    <input type="color" id="trilhaColor" value="#e67e22">
                </label>
                <p id="trilhaPointsCount" class="form-hint">0 pontos demarcados</p>
                <div class="modal-actions">
                    <button type="button" id="cancelTrilhaButton">Cancelar</button>
                    <button type="submit">Salvar trilha</button>
                </div>
            </form>
        </div>
    </div>

    <div id="trilhaSelectModal" class="modal hidden">
        <div class="modal-content modal-content-compact">
            <button id="closeTrilhaSelectModal" class="modal-close" type="button">×</button>
            <h3>Trilha no mapa</h3>
            <p class="form-hint">Escolha uma trilha para exibir. Somente uma pode aparecer por vez.</p>
            <label>Trilha
                <select id="trilhaSelect">
                    <option value="">Nenhuma</option>
                </select>
            </label>
            <div class="modal-actions">
                <button type="button" id="cancelTrilhaSelectButton">Fechar</button>
                <button type="button" id="applyTrilhaSelectButton">Aplicar</button>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <div id="mapControls" class="map-controls hidden">
        <button id="btnAbrirTrilhas" class="map-control map-control-wide" type="button" title="Escolher trilha no mapa">Trilhas</button>
        <button id="btnModoTrilha" class="map-control map-control-wide hidden" type="button" title="Alternar modo trilha">Criar trilha</button>
        <button id="btnDesfazerPonto" class="map-control map-control-wide hidden" type="button" title="Remover último ponto">Desfazer</button>
        <button id="btnSalvarTrilha" class="map-control map-control-wide hidden" type="button" title="Salvar trilha">Salvar</button>
        <button id="btnCancelarTrilha" class="map-control map-control-wide hidden" type="button" title="Cancelar trilha">Cancelar</button>
        <button id="btnCentralizar" class="map-control" title="Centralizar na minha posição">⦿</button>
    </div>

    <!-- Leaflet JS -->
    <script>window.USER_MODE = 'admin';</script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
