<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa Interativo - INPE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; display: none; }
        #telaInicial { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #btnLocalizar { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="telaInicial">
        <h2>Mapa Interativo</h2>
        <button id="btnLocalizar">📍 Localizar-me</button>
        <button id="btnAbrirMapa" class="secondary-button" type="button">Abrir mapa sem localização</button>
    </div>

    <div id="infoModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal" class="modal-close">×</button>
            <div id="modalSlider" class="modal-slider hidden">
                <button id="sliderPrev" type="button" class="slider-button">‹</button>
                <div class="slider-frame" title="Clique para ampliar">
                    <img id="sliderImage" src="" alt="Foto do local">
                    <div id="sliderCaption" class="slider-caption"></div>
                </div>
                <button id="sliderNext" type="button" class="slider-button">›</button>
            </div>
            <div id="sliderCounter" class="slider-counter"></div>
            <h3 id="modalTitle"></h3>
            <p id="modalDescription"></p>
            <button id="closeModalFooter" class="modal-footer-close" type="button">Fechar</button>
        </div>
    </div>

    <div id="imageViewer" class="image-viewer hidden">
        <div class="image-viewer-content">
            <button id="closeViewer" class="viewer-close" type="button">×</button>
            <img id="viewerImage" src="" alt="Imagem ampliada">
        </div>
    </div>

    <div id="markerFormModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeFormModal" class="modal-close">×</button>
            <h3>Novo ponto</h3>
            <form id="markerForm">
                <label>Nome do local
                    <input type="text" id="markerName" required>
                </label>
                <label>Status
                    <select id="markerStatus">
                        <option value="Aberto">Aberto</option>
                        <option value="Fechado">Fechado</option>
                    </select>
                </label>
                <label>Descrição
                    <textarea id="markerDescription" rows="6" required></textarea>
                </label>
                <label>Imagens</label>
                <div id="imageDropZone" class="upload-zone">
                    Arraste as imagens aqui ou clique para selecionar
                </div>
                <input type="file" id="imageInput" accept="image/*" multiple hidden>
                <div id="imagePreview" class="preview-list"></div>
                <div class="modal-actions">
                    <button type="button" id="cancelMarkerButton">Cancelar</button>
                    <button type="submit">Salvar ponto</button>
                </div>
            </form>
        </div>
    </div>

    <div id="map"></div>
    <button id="btnCentralizar" class="map-control" title="Centralizar na minha posição">⦿</button>

    <!-- Leaflet JS -->
    <script>window.USER_MODE = 'admin';</script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
