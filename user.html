<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa Interativo - Usuário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { height: 100vh; display: none; }
        #telaInicial { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #btnLocalizar { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="telaInicial">
        <h2>Mapa Interativo - Usuário</h2>
        <button id="btnLocalizar">📍 Localizar-me</button>
    </div>

    <div id="infoModal" class="modal info-modal hidden">
        <div class="modal-content info-modal-card">
            <button id="closeModal" class="modal-close info-modal-close" type="button" aria-label="Fechar">×</button>
            <div id="modalSlider" class="info-modal-media hidden">
                <div class="slider-frame">
                    <img id="sliderImage" src="" alt="Foto do local">
                    <button id="sliderPrev" type="button" class="slider-button slider-button-prev" aria-label="Foto anterior">‹</button>
                    <button id="sliderNext" type="button" class="slider-button slider-button-next" aria-label="Próxima foto">›</button>
                    <div id="sliderCounter" class="slider-counter"></div>
                    <span class="slider-hint">Toque para ampliar</span>
                </div>
            </div>
            <div class="info-modal-body">
                <p class="info-modal-kicker">Local no mapa</p>
                <h3 id="modalTitle"></h3>
                <div class="info-modal-divider"></div>
                <p id="modalDescription"></p>
                <div class="modal-actions info-modal-actions">
                    <button type="button" id="closeInfoModalButton">Fechar</button>
                </div>
            </div>
        </div>
    </div>
    <div id="imageViewer" class="image-viewer hidden">
        <div class="image-viewer-content">
            <button id="closeViewer" class="viewer-close">×</button>
            <img id="viewerImage" src="" alt="Imagem ampliada">
        </div>
    </div>

    <div id="trilhaSelectModal" class="modal hidden">
        <div class="modal-content modal-content-compact">
            <button id="closeTrilhaSelectModal" class="modal-close" type="button">×</button>
            <h3>Trilha no mapa</h3>
            <p class="form-hint">Escolha uma trilha para exibir. Somente uma pode aparecer por vez.</p>
            <label>Trilha
                <select id="trilhaSelect">
                    <option value="">Nenhuma</option>
                </select>
            </label>
            <div class="modal-actions">
                <button type="button" id="cancelTrilhaSelectButton">Fechar</button>
                <button type="button" id="applyTrilhaSelectButton">Aplicar</button>
            </div>
        </div>
    </div>

    <div id="map"></div>
    <div id="mapControls" class="map-controls hidden">
        <button id="btnAbrirTrilhas" class="map-control map-control-wide" type="button" title="Escolher trilha no mapa">Trilhas</button>
        <button id="btnCancelarRota" class="map-control map-control-wide hidden" type="button" title="Cancelar rota">Cancelar rota</button>
        <button id="btnCentralizar" class="map-control" title="Centralizar na minha posição">⦿</button>
    </div>

    <script>window.USER_MODE = 'viewer';</script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
